[project]
name = "sentineltext"
version = "1.0.0"
description = "SentinelText — voice journaling and wellness reflection API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "groq>=0.11.0",
    "pwdlib[argon2]>=0.2.1",
    "python-jose[cryptography]>=3.3.0",
    "email-validator>=2.1.0",
    "scikit-learn>=1.4.0",
    "psycopg[binary]>=3.2.0",
]

[tool.vercel]
entrypoint = "api/index.py:app"
